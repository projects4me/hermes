name: Caching npm packages

on:
  push:
    branches:
      - 'dev'

jobs:
  Install-and-cache-npm-packages:

    runs-on: ubuntu-latest
    container:
      image: node:18
    steps:
    - name: Checkout to Repository
      uses: actions/checkout@v3

    - name: Cache Node packages
      id: node-packages
      uses: actions/cache@v3
      with:
        path: node_modules
        key: npm-cache

    - name: Watch change in package.json
      id: watch-package-json
      uses: tj-actions/changed-files@v32
      with:
          files: "package.json"

    - name: Install Node modules
      if: |
        steps.watch-package-json.outputs.any_changed == 'true'
        || steps.node-packages.outputs.cache-hit != 'true'
      run: |
        rm -rf node_modules/
        npm install
