version: '3.8'

services:
  hermes:
    build: .
    container_name: hermes
    ports:
      - "9000:9000"
    volumes:
      - ./:/app
      - /app/node_modules
      - hermes-identity:/var/lib/hermes
    environment:
      - NODE_ENV=development
      - PORT=9000
      - GAIA_URL=http://host.docker.internal:8080
      - HERMES_SECRET=hermes-dev-secret
      - CORS_ORIGIN=http://localhost:4200,http://127.0.0.1:4200
      - HERMES_CREDENTIAL_FILE=/var/lib/hermes/credential.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # api-tester live target: socket auth against gaia-test (:8081).
  hermes-test:
    build: .
    container_name: hermes-test
    ports:
      - "9001:9001"
    volumes:
      - ./:/app
      - /app/node_modules
      - hermes-test-identity:/var/lib/hermes
    environment:
      - NODE_ENV=development
      - PORT=9001
      - GAIA_URL=http://host.docker.internal:8081
      - HERMES_SECRET=hermes-dev-secret
      - CORS_ORIGIN=http://localhost:4200,http://127.0.0.1:4200
      - HERMES_CREDENTIAL_FILE=/var/lib/hermes/credential.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Docs collab server (D-022), a separate process from the relay.
  collab:
    build: ./collab
    container_name: collab
    ports:
      - "1234:1234"
    volumes:
      - ./collab:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - COLLAB_PORT=1234
      - GAIA_URL=http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Longer than server.js's 30 s exit timeout, so the final saves can finish (D-022).
    stop_grace_period: 35s
    restart: unless-stopped

# Each Hermes keeps its own service credential (D-019) for socket-auth
# introspection (D-002). The first start enrolls: approve the logged user code
# in Projects4Me, or set GAIA_ENROLLMENT_TOKEN.
volumes:
  hermes-identity:
  hermes-test-identity:
